name: JSON Pipeline

on:
  push:
    branches:
      - main

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install pandas

      - name: Run Pipeline
        run: |
          python main.py
          
